# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; the canonical solutions and
# grading options stay in this repo-root sidecar, which vgi-lint auto-discovers.
tasks:
  - name: list-example-clips
    reference_sql: "SELECT name, duration FROM audio.main.example_clips ORDER BY name"
    ignore_column_names: true
  - name: tone-metadata-row
    reference_sql: "SELECT duration, sample_rate, channels FROM audio.main.audio_info(from_base64(''))"
    ignore_column_names: true
  - name: click-has-beats
    reference_sql: "SELECT count(*) > 0 AS answer FROM audio.main.beats(from_base64(''))"
    ignore_column_names: true
  - name: tone-duration-short
    reference_sql: "SELECT audio.main.duration(audio) < 1.0 AS answer FROM audio.main.example_clips WHERE name = 'tone'"
    ignore_column_names: true
  - name: click-sample-rate-high
    reference_sql: "SELECT audio.main.sample_rate(audio) >= 5000 AS answer FROM audio.main.example_clips WHERE name = 'click'"
    ignore_column_names: true
  - name: tone-is-mono
    reference_sql: "SELECT audio.main.channels(audio) = 1 AS answer FROM audio.main.example_clips WHERE name = 'tone'"
    ignore_column_names: true
  - name: click-tempo-fast
    reference_sql: "SELECT audio.main.tempo(audio) > 100 AS answer FROM audio.main.example_clips WHERE name = 'click'"
    ignore_column_names: true
  - name: click-rms-loud
    reference_sql: "SELECT audio.main.rms_energy(audio) > 0.1 AS answer FROM audio.main.example_clips WHERE name = 'click'"
    ignore_column_names: true
  - name: tone-zcr-low
    reference_sql: "SELECT audio.main.zero_crossing_rate(audio) < 0.05 AS answer FROM audio.main.example_clips WHERE name = 'tone'"
    ignore_column_names: true
  - name: click-centroid-bright
    reference_sql: "SELECT audio.main.spectral_centroid(audio) > 500 AS answer FROM audio.main.example_clips WHERE name = 'click'"
    ignore_column_names: true
  - name: tone-bandwidth-wide
    reference_sql: "SELECT audio.main.spectral_bandwidth(audio) > 200 AS answer FROM audio.main.example_clips WHERE name = 'tone'"
    ignore_column_names: true
  - name: click-mfcc-13
    reference_sql: "SELECT len(audio.main.mfcc(audio)) = 13 AS answer FROM audio.main.example_clips WHERE name = 'click'"
    ignore_column_names: true
  - name: click-key-minor
    reference_sql: "SELECT audio.main.estimated_key(audio) LIKE '%minor%' AS answer FROM audio.main.example_clips WHERE name = 'click'"
    ignore_column_names: true
  - name: brightest-clip-tempo
    reference_sql: "SELECT name, CAST(round(audio.main.tempo(audio)) AS INTEGER) AS bpm FROM audio.main.example_clips ORDER BY audio.main.spectral_centroid(audio) DESC LIMIT 1"
    ignore_column_names: true
