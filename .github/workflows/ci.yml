name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow docker-publish.yml / release.yml to gate on this workflow.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Pin the interpreter: the runner uv otherwise picks the newest CPython,
    # which native deps (numba/llvmlite) may not ship wheels for yet.
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vgi_audio/ audio_worker.py

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_audio/ audio_worker.py

  # Metadata-quality gate: build the worker, then run the signed vgi-lint
  # community linter against it and fail on any finding (info or worse). Kept a
  # separate job so the catalog/schema/function metadata quality is visible.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install system libraries (Linux)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker (with the http extra)
        run: uv sync --frozen --python 3.14 --extra http

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Use the venv python (the frozen, locked SDK) rather than
          # `uv run <script>`: a PEP-723 `uv run` env can resolve a different
          # vgi-python than uv.lock pins and emit a stale catalog schema.
          location: ".venv/bin/python audio_worker.py"
          fail-on: info

  # SQL tests: test/sql/*.test through the published haybarn-unittest with the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starters template). `launch` starts the worker once on a
  # unix socket and pools connections.
  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.14"
      HAYBARN_VERSION: "2.0.0rc11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install system libraries (Linux)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/.venv/bin/vgi-audio-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} PYTHON="uv run --no-project python" ci/run-integration.sh
